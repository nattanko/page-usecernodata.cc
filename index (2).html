<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cernodata — open-source ETL framework for layout-aware PDF extraction</title>
<meta name="description" content="Open-source ETL framework for layout-aware PDF extraction, automated quality iteration, structural layout debugging, and dataset generation for RAG and LLM fine-tuning.">

<meta property="og:title" content="Cernodata">
<meta property="og:description" content="Open-source ETL framework for layout-aware PDF extraction, automated quality iteration, structural layout debugging, and dataset generation for RAG and LLM fine-tuning.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cernodata.cc/">

<link rel="canonical" href="https://cernodata.cc/">

<style>
  :root {
    --canvas:       #0d1117;
    --btn:          #212830;
    --btn-hover:    #2a313c;
    --border:       #3d444d;
    --border-hover: #4f5760;
    --fg:           #f0f6fc;
    --fg-muted:     #9198a1;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
            Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Liberation Mono", monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--canvas);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    display: block;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent 70%);
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(3rem, 12vh, 7rem) 1.5rem 4rem;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    color: var(--fg-muted);
    margin: 0 0 1.75rem;
  }

  h1 {
    font-size: clamp(2.1rem, 7vw, 3rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-weight: 600;
    color: var(--fg);
    margin: 0 0 1.1rem;
  }

  .lead {
    font-size: 1.05rem;
    color: var(--fg-muted);
    margin: 0 0 2.75rem;
    max-width: 34em;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin: 0 0 3.5rem;
  }

  .btn {
    display: inline-block;
    padding: 0.65rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--btn);
    color: var(--fg-muted);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .btn:hover,
  .btn:focus-visible {
    background: var(--btn-hover);
    border-color: var(--border-hover);
    color: var(--fg);
  }

  .btn--primary { color: var(--fg); }

  .creators {
    border-top: 1px solid var(--border);
    padding-top: 1.75rem;
  }

  .creators h2 {
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    margin: 0 0 1rem;
  }

  .creators ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .creators a {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--fg-muted);
    text-decoration: none;
    font-size: 0.95rem;
    width: fit-content;
    transition: color 0.15s ease;
  }

  .creators a:hover,
  .creators a:focus-visible { color: var(--fg); }

  .creators svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    fill: currentColor;
    opacity: 0.75;
  }

  .creators a:hover svg,
  .creators a:focus-visible svg { opacity: 1; }

  :focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 3px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <main class="wrap">

    <p class="eyebrow">cernodata.cc</p>

    <h1>Cernodata</h1>

    <p class="lead">Cernodata is an open-source ETL framework for layout-aware PDF extraction, automated quality iteration, structural layout debugging, and dataset generation for RAG and LLM fine-tuning.</p>

    <div class="links">
      <a class="btn btn--primary" href="https://github.com/cernodatainc/cernodata"
         target="_blank" rel="noopener noreferrer">
        GitHub
      </a>
    </div>

    <section class="creators">
      <h2>Creators</h2>
      <ul>
        <li>
          <a href="https://www.linkedin.com/in/natan-korzeniewski/"
             target="_blank" rel="noopener noreferrer">

            <span>Natan Korzeniewski</span>
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com/in/mich4l-w0jcik/"
             target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zm1.78 13.02H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.22.79 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
            <span>Michał Wójcik</span>
          </a>
        </li>
      </ul>
    </section>

  </main>

</body>
</html>
